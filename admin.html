<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viseu · Controlo de dados</title><link rel="stylesheet" href="styles.css"></head><body><header class="masthead"><div class="wrap"><a class="brand" href="/">viseu<span>.</span></a><span>Controlo de dados · acesso local</span></div></header><main class="wrap"><div class="page-title"><p class="kicker">Administração</p><h1>Qualidade e proveniência</h1><p>Consulta da base de dados real e importação de ficheiros de investigação. Não publica dados.</p></div><div class="panel"><form id="auth" class="row"><label for="token">Token de administração</label><input id="token" type="password" required autocomplete="off" placeholder="Token local"><button>Consultar estado</button></form><p id="message" role="status" class="muted"></p><div id="upload" class="hidden"><label for="file">Importar snapshot JSON V31</label><input id="file" type="file" accept=".json,application/json"><button id="import" type="button">Importar</button></div></div><section class="section" id="results" aria-live="polite"></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let token='';async function call(path,options={}){const r=await fetch('/api/admin/'+path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro de acesso');return d}async function refresh(){const d=await call('status');$('#results').innerHTML='<div class="grid">'+[['Freguesias',d.parishes],['Preços em investigação',d.fuelObservations],['Quarentena',d.quarantined]].map(x=>'<article class="tile"><p>'+x[0]+'</p><div class="stat">'+x[1]+'</div></article>').join('')+'</div><h2>Fontes</h2><div class="tablewrap"><table><thead><tr><th>Fonte</th><th>Publicação</th><th>Limitação</th></tr></thead><tbody>'+d.sources.map(s=>'<tr><td>'+esc(s.id)+'</td><td>'+esc(s.publication)+'</td><td>'+esc(s.limitation)+'</td></tr>').join('')+'</tbody></table></div><h2>Snapshots</h2><ul class="linklist">'+d.research.map(s=>'<li><span>'+esc(s.captured)+' · '+esc(s.source)+'</span><span>'+s.observations+' registos · '+esc(s.rights)+'</span></li>').join('')+'</ul><h2>Auditoria</h2><ul class="linklist">'+d.audit.map(a=>'<li><span>'+esc(a.ts)+'</span><span>'+esc(a.action)+'</span></li>').join('')+'</ul>';$('#upload').classList.remove('hidden')}$('#auth').onsubmit=async e=>{e.preventDefault();token=$('#token').value;try{await refresh();$('#message').textContent='Sessão local autorizada.'}catch(e){$('#message').textContent=e.message;$('#upload').classList.add('hidden');$('#results').innerHTML=''}};$('#import').onclick=async()=>{try{let f=$('#file').files[0];if(!f||f.size>2e6)throw Error('Seleciona um JSON de até 2 MB');let d=await call('import',{method:'POST',headers:{'Content-Type':'application/json'},body:await f.text()});$('#message').textContent=d.duplicate?'Snapshot já importado.':d.accepted+' registos aceites; '+d.rejected+' em quarentena.';await refresh()}catch(e){$('#message').textContent=e.message}};
</script></body></html>
